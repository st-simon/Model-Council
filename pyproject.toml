[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "model-council"
version = "0.1.0"
description = "Auditable blind multi-model engineering review workflow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28.1,<0.29",
  "orjson>=3.10,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.scripts]
council = "model_council.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_council"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["model_council"]
